name: Update visual baselines

# Regenerates the Playwright visual baselines on Linux (the CI renderer) and
# commits them to the branch it was run on. Run it after an intended visual
# change, or when a new template route is added:
#   gh workflow run "Update visual baselines" --ref <branch>
# Pushes made with GITHUB_TOKEN do not start new workflow runs, so re-run PR
# Checks (or push any commit) afterwards to see the gate pass.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: visual-baselines-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Regenerate and commit baselines
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://getthursdai.com
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Regenerate baselines
        run: npx playwright test tests/e2e/visual.spec.ts --update-snapshots=all
      - name: Commit baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "Baselines unchanged."
            exit 0
          fi
          git commit -m "Update visual baselines (Linux, ${GITHUB_SHA::7})"
          git push origin "HEAD:${GITHUB_REF_NAME}"
