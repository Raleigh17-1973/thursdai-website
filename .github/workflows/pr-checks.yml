name: PR Checks

on:
  pull_request:
    branches: [main, staging]

jobs:
  checks:
    name: Type check, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # src/lib/velite.ts imports the generated .velite output; normally made by prebuild.
      - name: Generate content (Velite)
        run: npx velite build
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint -- --max-warnings 0
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://getthursdai.com
      - name: Check origin
        run: npm run check:origin
      - name: Check empty pages
        run: npm run check:pages

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://getthursdai.com
      - run: npx @lhci/cli@0.14.x autorun
        # Report-only until the design system (plan Item 2) and visuals (Item 6) land:
        # contrast and LCP failures need that work. Remove to make it blocking again.
        continue-on-error: true
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
